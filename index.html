function memberForm(mode){

 app.innerHTML=`<h2>${dft?'Daftar Member':'Login Member'}</h2><div class=card>${dft?'<label>Nama<input id=mn></label><label>No WA aktif<input id=mw type=tel></label>':''}<label>Email<input id=me type=email></label><label>Password<input id=mp type=password></label><button id=mg>${dft?'Daftar':'Masuk'}</button><button class=alt id=ms>${dft?'Sudah punya akun? Masuk':'Belum punya akun? Daftar'}</button><p id=mm class=err></p></div>`;

 $('#mg').onclick=async()=>{
  const v=k=>$('#'+k).value.trim(),m=$('#mm');
  if(!v('me')||!$('#mp').value)return m.textContent='Email dan password wajib diisi.';
  if(dft){
   if(!v('mn')||!v('mw'))return m.textContent='Nama dan No WA wajib diisi.';
   if($('#mp').value.length<6)return m.textContent='Password minimal 6 karakter.';
   const {data,error}=await sb.auth.signUp({email:v('me'),password:$('#mp').value,options:{data:{nama:v('mn'),wa:v('mw')}}});

   if(data.session)return member();

   const {error}=await sb.auth.signInWithPassword({email:v('me'),password:$('#mp').value});

  }

 const SERTIFIKAT={
 '2026-11-04':'IMG-20261029-WA0022.jpg'

function muatJspdf(){return new Promise((ok,no)=>{if(window.jspdf)return ok();const c=document.createElement('script');c.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';c.onload=ok;c.onerror=no;document.head.appendChild(c)})}
function muatGambar(src){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=src})}
window.buatSertifikat=async i=>{
 const r=PL[i],ev=PE.find(x=>x.id==r.event_id),f=SERTIFIKAT[ev.tanggal];
 if(!f)return note('Desain sertifikat untuk acara ini belum ada.',1);
 try{await muatJspdf()}catch(e){return note('Gagal memuat modul PDF. Cek internet.',1)}
 let im;try{im=await muatGambar(f)}catch(e){return note('Gambar sertifikat tidak ditemukan.',1)}
 try{await document.fonts.load('700 100px "Dancing Script"')}catch(e){}
 const W=im.naturalWidth,H=im.naturalHeight,c=document.createElement('canvas');
 c.width=W;c.height=H;
 const x=c.getContext('2d');x.drawImage(im,0,0,W,H);
 x.fillStyle='#5a2750';x.textAlign='center';x.textBaseline='middle';
 let fs=W*0.06;const nm=r.nama.trim().toLowerCase().replace(/(^|\s)\S/g,m=>m.toUpperCase());
 x.font='700 '+fs+'px "Dancing Script",cursive';
 while(x.measureText(nm).width>W*0.6&&fs>20){fs-=2;x.font='700 '+fs+'px "Dancing Script",cursive'}
 x.fillText(nm,W/2,H*0.44);
 const {jsPDF}=window.jspdf,h=297*H/W;
 const pdf=new jsPDF({orientation:'l',unit:'mm',format:[297,h]});
 pdf.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',0,0,297,h);
 const blob=pdf.output('blob');
 const nama='Sertifikat-'+r.nama.replace(/[^A-Za-z0-9]+/g,'_').slice(0,30)+'.pdf';
 const file=new File([blob],nama,{type:'application/pdf'});
 if(navigator.canShare&&navigator.canShare({files:[file]})){
  try{await navigator.share({files:[file],title:'Sertifikat '+r.nama});return}
  catch(e){if(e.name==='AbortError')return}
 }
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nama;a.click();
 setTimeout(()=>URL.revokeObjectURL(a.href),5000);
};

 let acBunyi=null;
function bunyi(ok){
 try{
  acBunyi=acBunyi||new (window.AudioContext||window.webkitAudioContext)();
  if(acBunyi.state==='suspended')acBunyi.resume();
  const nada=ok?[[880,0,.12]]:[[330,0,.18],[330,.25,.18]];
  nada.forEach(([f,t,d])=>{
   const o=acBunyi.createOscillator(),g=acBunyi.createGain(),w=acBunyi.currentTime;
   o.frequency.value=f;o.type='sine';
   g.gain.setValueAtTime(.0001,w+t);
   g.gain.exponentialRampToValueAtTime(.4,w+t+.02);
   g.gain.exponentialRampToValueAtTime(.0001,w+t+d);
   o.connect(g);g.connect(acBunyi.destination);
   o.start(w+t);o.stop(w+t+d+.05);
  });
 }catch(e){}
 try{if(navigator.vibrate)navigator.vibrate(ok?120:[200,100,200])}catch(e){}
}
new MutationObserver(ms=>{
 for(const m of ms){
  if(m.target.id!=='res')continue;
  for(const n of m.addedNodes){
   if(n.nodeType!==1)continue;
   if(n.classList.contains('ok'))bunyi(true);
   else if(n.classList.contains('bad'))bunyi(false);
  }
 }
}).observe(document.body,{childList:true,subtree:true});

async function tSc(){
 if(!await evPicker())return $('#out').innerHTML='<p class=c>Buat acara dulu.</p>';
 $('#out').innerHTML='<button id=st style="margin:10px 0;width:100%">Mulai Scan</button><div id=rd></div><div id=res></div>';
 $('#st').onclick=async()=>{
  await stopScan();scanner=new Html5Qrcode('rd');
  try{await scanner.start({facingMode:'environment'},{fps:10,qrbox:240},onScan)}
  catch(e){$('#res').innerHTML='<div class=bad>Kamera tidak bisa dibuka. Izinkan akses kamera.</div>'}
 };
}
async function onScan(txt){
 if(busy)return;busy=true;setTimeout(()=>busy=false,2500);
 const res=$('#res');
 if(!/^[0-9a-f-]{36}$/i.test(txt))return res.innerHTML='<div class=bad>QR tidak dikenali.</div>';
 const {data}=await sb.from('registrations').select('id,nama,event_id,hadir_at,wl').eq('id',txt).maybeSingle();
 if(!data)return res.innerHTML='<div class=bad>❌ Peserta tidak ditemukan.</div>';
 if(data.event_id!==$('#se').value)return res.innerHTML=`<div class=bad>❌ ${esc(data.nama)} terdaftar di acara lain.</div>`;
 if(data.wl)return res.innerHTML=`<div class=bad>⚠️ ${esc(data.nama)} masih di waiting list.</div>`;
 if(data.hadir_at)return res.innerHTML=`<div class=bad>⚠️ ${esc(data.nama)} sudah tercatat hadir sebelumnya.</div>`;
 const {error}=await sb.from('registrations').update({hadir_at:new Date().toISOString()}).eq('id',txt);
 res.innerHTML=error?'<div class=bad>Gagal mencatat.</div>':`<div class=ok>✅ ${esc(data.nama)} — hadir tercatat</div>`;
}
