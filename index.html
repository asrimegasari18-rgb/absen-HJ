<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Absensi Kajian Rutin dan Dauroh Hamimatul Jannah</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--p:#5a2750;--m:#c9a2bd;--l:#f1e1ea;--bg:#fdf6f3;--t:#2b1a27}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#fdf6f3 0%,#f8ecf1 100%) fixed;color:var(--t);font:18px 'Patrick Hand',system-ui,sans-serif}
input,select,button{font-family:inherit}
header{text-align:center;padding:18px 16px 4px}
header img{width:min(300px,70%);height:auto}
h1{font:700 1.8rem/1.25 'Dancing Script',cursive;color:var(--p);margin:6px 0 0}
main{max-width:560px;margin:0 auto;padding:12px 16px 40px}
h2,h3{color:var(--p);font-family:'Dancing Script',cursive;font-weight:700;margin:14px 0 8px}h2{font-size:1.9rem}h3{font-size:1.5rem}
.card{background:#fff;border:1px solid var(--l);border-radius:18px;padding:14px;margin:10px 0;display:flex;flex-direction:column;gap:8px;box-shadow:0 3px 12px #5a275014}
small{color:#7a6573}
label{display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--p)}
label.ck{flex-direction:row;align-items:center}
input,select{padding:11px;border:1px solid var(--m);border-radius:10px;font-size:1rem;background:#fff;width:100%}
input[type=checkbox]{width:auto}
button{font-weight:400;font-size:1.05rem;background:var(--p);color:#fff;border:0;border-radius:10px;padding:12px;font-size:1rem;cursor:pointer}
button.sm{padding:6px 10px;font-size:.8rem}
button.alt{background:var(--l);color:var(--p)}
.full{background:var(--l);color:var(--p);padding:10px;border-radius:10px;text-align:center;font-weight:600}
.c{text-align:center;align-items:center}
.err{color:#b3261e;margin:0}
.ok{background:#e4f3e6;color:#1b5e20;padding:12px;border-radius:10px;font-weight:600}
.bad{background:#fde7e7;color:#b3261e;padding:12px;border-radius:10px;font-weight:600}
nav{display:flex;gap:6px;margin:8px 0}
.tab{flex:1;background:var(--l);color:var(--p);padding:10px 4px}
.tab.on{background:var(--p);color:#fff}
.qr{padding:12px;background:#fff;border:2px solid var(--m);border-radius:12px}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.85rem}
td,th{border-bottom:1px solid var(--l);padding:6px;text-align:left;white-space:nowrap}
a{color:var(--p)}footer{text-align:center;padding:10px}footer a{font-size:.8rem;color:#a58a9b}
.sp{max-width:560px;margin:0 auto;padding:0 16px 8px;text-align:center}.sp h3{font-size:.95rem;margin:10px 0}
.spl{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-items:center}.spl img{max-height:56px;max-width:130px;object-fit:contain}
.run{overflow:hidden;white-space:nowrap;background:var(--l);color:var(--p);border-radius:10px;margin:10px 16px 0;padding:9px 0;font-family:'Dancing Script',cursive;font-weight:600;font-size:1.35rem}
.run span{display:inline-block;padding-left:100%;animation:run 28s linear infinite}
@keyframes run{to{transform:translateX(-100%)}}
.printhead{display:none}
@media print{
 body{background:#fff}
 .run,footer,.sp,nav,.noprint,#se,.ok,.bad{display:none!important}
 .printhead{display:block;text-align:center;margin:6px 0 10px}
 main{max-width:none;padding:0 8px}
 .tbl{overflow:visible}table{font-size:11px}td,th{white-space:normal;border:1px solid #999}
}
.hj{white-space:nowrap;font-size:2.2rem}
body{position:relative;overflow-x:hidden}
header,main,.run,.sp,footer{position:relative;z-index:1}
.bgp{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,rgba(253,246,243,.90) 0%,rgba(253,246,243,.80) 55%,rgba(253,246,243,.68) 100%),url(bg.jpg) 72% 100%/cover no-repeat}
@media print{.bgp{display:none!important}}
</style></head><body>
<div class="bgp" aria-hidden="true"></div>
<header><img src="logo.png" alt="Hamimatul Jannah" onerror="this.onerror=null;this.src='logo.jpg'"><h1>Absensi Kajian Rutin dan Dauroh<br><span class="hj">Hamimatul Jannah</span></h1></header>
<div id="run" class="run"><span>Ada taman-taman surga di dunia ini. Maka jangan lewatkan kesempatan untuk duduk di dalamnya... &nbsp;&nbsp;&nbsp;🌸&nbsp;&nbsp;&nbsp; Ada taman-taman surga di dunia ini. Maka jangan lewatkan kesempatan untuk duduk di dalamnya...</span></div>
<main id="app"></main>
<div id="sp" class="sp"></div>
<footer><a href="#admin">Admin</a><br><small>versi 20</small></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script>
const SUPABASE_URL="https://fofjljgkzkrnhqbbhnyb.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZvZmpsamdremtybmhxYmJobnliIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5NzgyMjgsImV4cCI6MjEwODU1NDIyOH0.y4r96iMeK2FTl1qIBpC-1lRJbmQTY0KuBshxll4UfNY";
// Logo sponsor: taruh file gambar di GitHub (folder yang sama), lalu tulis namanya di sini. Contoh: ['sponsor1.png','sponsor2.jpg']
const SPONSORS=[];
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>new Date(d+'T00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
window.onerror=m=>{const d=document.createElement('div');d.className='bad';d.textContent='Error: '+m;document.body.prepend(d)};
function ask(msg){return new Promise(r=>{
 const o=document.createElement('div');
 o.style.cssText='position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;padding:20px;z-index:99';
 o.innerHTML=`<div class=card style="max-width:380px;width:100%"><p style="margin:0">${esc(msg)}</p><button id=ya>Ya, lanjutkan</button><button class=alt id=tdk>Batal</button></div>`;
 document.body.appendChild(o);
 o.querySelector('#ya').onclick=()=>{o.remove();r(true)};
 o.querySelector('#tdk').onclick=()=>{o.remove();r(false)};
})}
function note(m,bad){const d=document.createElement('div');d.className=bad?'bad':'ok';d.style.cssText='position:fixed;left:12px;right:12px;top:12px;z-index:100';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),4500)}
let scanner=null,busy=false;
async function stopScan(){if(scanner){try{await scanner.stop()}catch(e){}scanner=null}}
window.onhashchange=route;route();
function sponsors(){const b=$('#sp');$('#run').style.display=location.hash.startsWith('#admin')?'none':'';b.innerHTML=(SPONSORS.length&&!location.hash.startsWith('#admin'))?`<h3>Didukung oleh</h3><div class=spl>${SPONSORS.map(f=>`<img src="${esc(f)}" alt="Sponsor">`).join('')}</div>`:''}
async function route(){sponsors();await stopScan();location.hash.startsWith('#admin')?admin():home()}

/* ===== PESERTA ===== */
async function home(){
 app.innerHTML='<p class=c>Memuat…</p>';
 const {data,error}=await sb.rpc('list_events');
 if(error)return app.innerHTML='<p class=c>Gagal memuat. Coba lagi.</p>';
 window.EV=data;
 app.innerHTML='<h2>Pilih Acara</h2>'+(data.length?data.map(e=>{
  const sisa=Math.max(e.kuota-e.terdaftar,0);
  return `<div class=card><b>${esc(e.title)}</b><small>${esc(e.tipe)} • ${fmt(e.tanggal)} • ${esc(e.jam)}</small><small>Sisa kuota: ${sisa}${!sisa&&e.wl_aktif?' • Waiting list: '+e.wl_count+' orang':''}</small>${sisa?`<button class=daf data-id="${e.id}">Daftar</button>`:(e.wl_aktif?`<div class=full>Kuota penuh</div><button class="daf alt" data-id="${e.id}">Daftar Waiting List</button>`:'<div class=full>Kuota penuh</div>')}</div>`}).join(''):'<p class=c>Belum ada acara yang dibuka.</p>');
 app.querySelectorAll('.daf').forEach(b=>b.onclick=()=>showForm(b.dataset.id));
}
window.showForm=id=>{
 const e=EV.find(x=>x.id==id);
 const full=Math.max(e.kuota-e.terdaftar,0)==0;
 app.innerHTML=`<h2>${esc(e.title)}</h2><small>${fmt(e.tanggal)} • ${esc(e.jam)}</small>
 ${full?'<div class=full>Kuota penuh. Kamu akan masuk Waiting List dan dihubungi lewat WhatsApp jika ada slot.</div>':''}<div class=card><label>Nama<input id=n></label><label>Umur<input id=u type=number></label><label>Domisili<input id=d></label><label>No WA aktif<input id=w type=tel></label><label>Email<input id=m type=email></label>
 <button id=go>${full?'Daftar Waiting List':'Daftar &amp; Dapatkan QR'}</button><button class=alt onclick="home()">Kembali</button><p id=msg class=err></p></div>`;
 $('#go').onclick=async()=>{
  const v=k=>$('#'+k).value.trim(),msg=$('#msg');
  if(!v('n')||!v('u')||!v('d')||!v('w')||!v('m'))return msg.textContent='Semua kolom wajib diisi.';
  if(!/^\S+@\S+\.\S+$/.test(v('m')))return msg.textContent='Format email belum benar.';
  $('#go').disabled=true;msg.textContent='';
  const {data,error}=await sb.rpc('register',{p_event:id,p_nama:v('n'),p_umur:+v('u'),p_domisili:v('d'),p_wa:v('w'),p_email:v('m')});
  if(error){$('#go').disabled=false;return msg.textContent=/PENUH/.test(error.message)?'Maaf, kuota sudah penuh.':/TUTUP/.test(error.message)?'Pendaftaran sudah ditutup.':'Gagal mendaftar. Coba lagi.'}
  const nm=v('n');
  if(data.wl){app.innerHTML=`<div class="card c"><h2>Masuk Waiting List ✅</h2><b>${esc(nm)}</b><small>${esc(e.title)}<br>${fmt(e.tanggal)} • ${esc(e.jam)}</small><div class=full>Nomor antrean: ${data.pos}</div><small>Kami akan menghubungi lewat WhatsApp jika ada slot. QR diberikan jika kamu naik dari waiting list.</small><button class=alt onclick="home()">Selesai</button></div>`;return}
  showQR(e,data.id,nm);
 };
};
function showQR(e,id,nama,back){
 app.innerHTML=`<div class="card c"><h2>Pendaftaran Berhasil ✅</h2><b>${esc(nama)}</b><small>${esc(e.title)}<br>${fmt(e.tanggal)} • ${esc(e.jam)}</small><div id=qr class=qr></div><button id=sv>Simpan QR ke Galeri</button><small>Simpan QR ini, lalu tunjukkan saat tiba di lokasi.</small><button class=alt id=bk>Selesai</button></div>`;
 $('#bk').onclick=()=>back?back():home();
 new QRCode($('#qr'),{text:id,width:240,height:240,correctLevel:QRCode.CorrectLevel.M});
 $('#sv').onclick=()=>{
  const src=$('#qr canvas'),c=document.createElement('canvas');c.width=360;c.height=450;
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,360,450);
  x.drawImage(src,60,20,240,240);x.fillStyle='#5a2750';x.textAlign='center';
  x.font='bold 28px "Dancing Script",cursive';x.fillText(nama.slice(0,28),180,300);
  x.font='16px sans-serif';x.fillText(e.title.slice(0,40),180,330);x.fillText(e.tanggal+' • '+e.jam,180,356);
  x.fillText('Hamimatul Jannah',180,410);
  const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='QR-'+nama.replace(/\s+/g,'_')+'.png';a.click();
 };
}

/* ===== ADMIN ===== */
async function admin(){
 const {data:{user}}=await sb.auth.getUser();
 user?panel():login();
}
function login(){
 app.innerHTML=`<h2>Login Admin</h2><div class=card><label>Email<input id=e type=email></label><label>Password<input id=p type=password></label><button id=go>Masuk</button><p id=msg class=err></p></div>`;
 $('#go').onclick=async()=>{
  const {error}=await sb.auth.signInWithPassword({email:$('#e').value.trim(),password:$('#p').value});
  error?$('#msg').textContent='Email atau password salah.':panel();
 };
}
const TABS=[['ev','Acara'],['ps','Peserta'],['sc','Scan']];
async function panel(t='ev'){
 await stopScan();
 app.innerHTML=`<nav>${TABS.map(([k,v])=>`<button class="tab ${k==t?'on':''}" onclick="panel('${k}')">${v}</button>`).join('')}<button class=tab onclick="sb.auth.signOut().then(login)">Keluar</button></nav><div id=box></div>`;
 ({ev:tEv,ps:tPs,sc:tSc})[t]();
}
window.panel=panel;
async function tEv(){
 const {data}=await sb.from('events').select('*').order('tanggal',{ascending:false});
 const {data:rg}=await sb.from('registrations').select('event_id,wl');
 (data||[]).forEach(e=>{const l=(rg||[]).filter(x=>x.event_id==e.id);e.n=l.filter(x=>!x.wl).length;e.w=l.filter(x=>x.wl).length});
 window.EVS=data||[];
 $('#box').innerHTML=`<div class=card><h3 id=ft style="margin:0">Tambah Acara</h3><input type=hidden id=eid>
 <label>Tema<input id=t></label><label>Jenis<select id=tp><option>Kajian Rutin</option><option>Dauroh</option></select></label>
 <label>Tanggal<input id=tg type=date></label><label>Jam<input id=j placeholder="09.00 - 11.00 WIB"></label>
 <label>Jumlah peserta maksimal<input id=k type=number value=50></label>
 <label class=ck><input id=a type=checkbox checked>&nbsp;Pendaftaran dibuka</label>
 <label class=ck><input id=wa type=checkbox checked>&nbsp;Aktifkan waiting list saat kuota penuh</label>
 <button id=sv>Simpan</button><p id=msg class=err></p></div>`+EVS.map((e,i)=>`<div class=card><b>${esc(e.title)}</b><small>${esc(e.tipe)} • ${fmt(e.tanggal)} • ${esc(e.jam)}</small><small>Terdaftar ${e.n}/${e.kuota} • Waiting list ${e.w} • ${e.aktif?'Dibuka':'Ditutup'}</small><button class=alt onclick="edit(${i})">Edit</button><button class=alt style="color:#b3261e" onclick="hapus(${i})">Hapus</button></div>`).join('');
 $('#sv').onclick=async()=>{
  const r={title:$('#t').value.trim(),tipe:$('#tp').value,tanggal:$('#tg').value,jam:$('#j').value.trim(),kuota:+$('#k').value,aktif:$('#a').checked,wl_aktif:$('#wa').checked};
  if(!r.title||!r.tanggal||!r.jam||!(r.kuota>0))return $('#msg').textContent='Lengkapi semua kolom.';
  const id=$('#eid').value;
  const {error}=id?await sb.from('events').update(r).eq('id',id):await sb.from('events').insert(r);
  error?$('#msg').textContent=error.message:tEv();
 };
}
window.hapus=async i=>{
 const e=EVS[i];
 if(!await ask('Hapus "'+e.title+'" beserta '+(e.n+e.w)+' data pesertanya? Tidak bisa dibatalkan.'))return;
 const {data,error}=await sb.from('events').delete().eq('id',e.id).select('id');
 if(error)return note('Gagal: '+error.message,1);
 if(!data||!data.length)return note('Tidak ada data yang berubah. Coba keluar lalu login admin lagi.',1);
 note('Acara dihapus.');tEv();
};
window.edit=i=>{const e=EVS[i];
 $('#eid').value=e.id;$('#t').value=e.title;$('#tp').value=e.tipe;$('#tg').value=e.tanggal;$('#j').value=e.jam;$('#k').value=e.kuota;$('#a').checked=e.aktif;$('#wa').checked=e.wl_aktif;
 $('#ft').textContent='Edit Acara';scrollTo(0,0);
};
async function evPicker(){
 const {data}=await sb.from('events').select('id,title,tipe,tanggal,jam,kuota').order('tanggal',{ascending:false});
 window.PE=data||[];
 $('#box').innerHTML=`<select id=se>${(data||[]).map(e=>`<option value="${e.id}">${esc(e.title)} (${e.tanggal})</option>`).join('')}</select><div id=out></div>`;
 return data&&data.length;
}
async function tPs(){
 if(!await evPicker())return $('#out').innerHTML='<p class=c>Belum ada acara.</p>';
 const load=async()=>{
  const {data}=await sb.from('registrations').select('*').eq('event_id',$('#se').value).order('created_at');
  window.PL=data;
  const ev=PE.find(x=>x.id==$('#se').value);
  const main=data.map((r,i)=>[r,i]).filter(x=>!x[0].wl),wl=data.map((r,i)=>[r,i]).filter(x=>x[0].wl);
  const h=main.filter(x=>x[0].hadir_at).length;
  $('#out').innerHTML=`<div class=printhead><b>${esc(ev.title)}</b><br>${esc(ev.tipe)} • ${fmt(ev.tanggal)} • ${esc(ev.jam)}</div><div class=noprint style="display:flex;gap:8px;margin:10px 0;flex-wrap:wrap"><button id=add style="flex:1">+ Tambah Peserta</button><button class=alt style="flex:1" onclick="window.print()">🖨️ Cetak</button><button class=alt style="flex:1" onclick="unduh()">⬇️ Excel</button></div><div id=af class=noprint></div><h3>Terdaftar ${main.length}/${ev.kuota} • Hadir ${h}</h3><div class=tbl><table><tr><th>Nama</th><th>Umur</th><th>Domisili</th><th>WA</th><th>Email</th><th>Hadir</th><th class=noprint>Aksi</th></tr>${main.map(([r,i])=>`<tr><td>${esc(r.nama)}</td><td>${r.umur??''}</td><td>${esc(r.domisili)}</td><td>${esc(r.wa)}</td><td>${esc(r.email)}</td><td>${r.hadir_at?'✅':'-'}</td><td class=noprint><button class="alt sm" onclick="lihatQR(${i})">QR</button> <button class="alt sm" onclick="kirimWA(${i})">WA</button> <button class="alt sm" style="color:#b3261e" onclick="batal(${i})">Batalkan</button></td></tr>`).join('')}</table></div>
  <h3>Waiting List (${wl.length})</h3>${wl.length?`<div class=tbl><table><tr><th>No</th><th>Nama</th><th>Domisili</th><th>WA</th><th>Email</th><th class=noprint>Aksi</th></tr>${wl.map(([r,i],k)=>`<tr><td>${k+1}</td><td>${esc(r.nama)}</td><td>${esc(r.domisili)}</td><td>${esc(r.wa)}</td><td>${esc(r.email)}</td><td class=noprint><button class="sm" onclick="naik(${i})">Naikkan</button> <button class="alt sm" style="color:#b3261e" onclick="batal(${i})">Hapus</button></td></tr>`).join('')}</table></div>`:'<small>Belum ada yang mengantre.</small>'}`;
  $('#add').onclick=addForm;
 };
 window.reloadPs=load;
 $('#se').onchange=load;load();
}
function addForm(){
 $('#af').innerHTML=`<div class=card><h3 style="margin:0">Tambah Peserta</h3><small>Tidak terpengaruh batas kuota.</small><label>Nama<input id=an></label><label>Umur<input id=au type=number></label><label>Domisili<input id=ad></label><label>No WA<input id=aw type=tel></label><label>Email<input id=am type=email></label><button id=ag>Simpan &amp; Buat QR</button><p id=amsg class=err></p></div>`;
 $('#ag').onclick=async()=>{
  const v=k=>$('#'+k).value.trim();
  if(!v('an')||!v('aw'))return $('#amsg').textContent='Nama dan No WA wajib diisi.';
  const ev=PE.find(x=>x.id==$('#se').value);
  const {data,error}=await sb.from('registrations').insert({event_id:ev.id,nama:v('an'),umur:v('au')?+v('au'):null,domisili:v('ad'),wa:v('aw'),email:v('am')}).select('id').single();
  if(error)return $('#amsg').textContent=/duplicate|unique/i.test(error.message)?'No WA ini sudah terdaftar di acara ini.':'Gagal: '+error.message;
  showQR(ev,data.id,v('an'),()=>panel('ps'));
 };
}
function loadXlsx(){return new Promise((ok,no)=>{if(window.XLSX)return ok();const c=document.createElement('script');c.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';c.onload=ok;c.onerror=no;document.head.appendChild(c)})}
window.unduh=async()=>{
 try{await loadXlsx()}catch(e){return note('Gagal memuat modul Excel. Cek internet.',1)}
 const ev=PE.find(x=>x.id==$('#se').value);
 const rows=PL.slice().sort((a,b)=>a.wl-b.wl).map((r,k)=>({'No':k+1,'Nama':r.nama,'Umur':r.umur??'','Domisili':r.domisili||'','No WA':String(r.wa),'Email':r.email||'','Status':r.wl?'Waiting List':'Terdaftar','Hadir':r.hadir_at?'Ya':'Tidak','Waktu Hadir':r.hadir_at?new Date(r.hadir_at).toLocaleString('id-ID'):''}));
 const ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();
 ws['!cols']=[{wch:5},{wch:26},{wch:7},{wch:20},{wch:16},{wch:28},{wch:13},{wch:8},{wch:20}];
 XLSX.utils.book_append_sheet(wb,ws,'Peserta');
 XLSX.writeFile(wb,'Peserta-'+ev.title.replace(/[^A-Za-z0-9]+/g,'_').slice(0,30)+'.xlsx');
};
window.batal=async i=>{
 const r=PL[i];
 if(!await ask(r.wl?'Hapus '+r.nama+' dari waiting list?':'Batalkan pendaftaran '+r.nama+'? QR-nya tidak berlaku lagi dan slot kuota terbuka.'))return;
 const {data,error}=await sb.from('registrations').delete().eq('id',r.id).select('id');
 if(error)return note('Gagal: '+error.message,1);
 if(!data||!data.length)return note('Tidak ada data yang berubah. Coba keluar lalu login admin lagi.',1);
 note('Berhasil.');reloadPs();
};
window.naik=async i=>{

 const SERTIFIKAT={
 '2026-11-04':'IMG-20261029-WA0022.jpg'
};
function muatJspdf(){return new Promise((ok,no)=>{if(window.jspdf)return ok();const c=document.createElement('script');c.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';c.onload=ok;c.onerror=no;document.head.appendChild(c)})}
function muatGambar(src){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=src})}
window.buatSertifikat=async i=>{
 const r=PL[i],ev=PE.find(x=>x.id==r.event_id),f=SERTIFIKAT[ev.tanggal];
 if(!f)return note('Desain sertifikat untuk acara ini belum ada.',1);
 try{await muatJspdf()}catch(e){return note('Gagal memuat modul PDF. Cek internet.',1)}
 let im;try{im=await muatGambar(f)}catch(e){return note('Gambar sertifikat tidak ditemukan.',1)}
 try{await document.fonts.load('700 100px "Dancing Script"')}catch(e){}
 const W=im.naturalWidth,H=im.naturalHeight,c=document.createElement('canvas');
 c.width=W;c.height=H;
 const x=c.getContext('2d');x.drawImage(im,0,0,W,H);
 x.fillStyle='#5a2750';x.textAlign='center';x.textBaseline='middle';
 let fs=W*0.06;const nm=r.nama.trim().toLowerCase().replace(/(^|\s)\S/g,m=>m.toUpperCase());
 x.font='700 '+fs+'px "Dancing Script",cursive';
 while(x.measureText(nm).width>W*0.6&&fs>20){fs-=2;x.font='700 '+fs+'px "Dancing Script",cursive'}
 x.fillText(nm,W/2,H*0.44);
 const {jsPDF}=window.jspdf,h=297*H/W;
 const pdf=new jsPDF({orientation:'l',unit:'mm',format:[297,h]});
 pdf.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',0,0,297,h);
 const blob=pdf.output('blob');
 const nama='Sertifikat-'+r.nama.replace(/[^A-Za-z0-9]+/g,'_').slice(0,30)+'.pdf';
 const file=new File([blob],nama,{type:'application/pdf'});
 if(navigator.canShare&&navigator.canShare({files:[file]})){
  try{await navigator.share({files:[file],title:'Sertifikat '+r.nama});return}
  catch(e){if(e.name==='AbortError')return}
 }
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nama;a.click();
 setTimeout(()=>URL.revokeObjectURL(a.href),5000);
};

async function tSc(){
 if(!await evPicker())return $('#out').innerHTML='<p class=c>Buat acara dulu.</p>';
 $('#out').innerHTML='<button id=st style="margin:10px 0;width:100%">Mulai Scan</button><div id=rd></div><div id=res></div>';
 $('#st').onclick=async()=>{
  await stopScan();scanner=new Html5Qrcode('rd');
  try{await scanner.start({facingMode:'environment'},{fps:10,qrbox:240},onScan)}
  catch(e){$('#res').innerHTML='<div class=bad>Kamera tidak bisa dibuka. Izinkan akses kamera.</div>'}
 };
}
async function onScan(txt){
 if(busy)return;busy=true;setTimeout(()=>busy=false,2500);
 const res=$('#res');
 if(!/^[0-9a-f-]{36}$/i.test(txt))return res.innerHTML='<div class=bad>QR tidak dikenali.</div>';
 const {data}=await sb.from('registrations').select('id,nama,event_id,hadir_at,wl').eq('id',txt).maybeSingle();
 if(!data)return res.innerHTML='<div class=bad>❌ Peserta tidak ditemukan.</div>';
 if(data.event_id!==$('#se').value)return res.innerHTML=`<div class=bad>❌ ${esc(data.nama)} terdaftar di acara lain.</div>`;
 if(data.wl)return res.innerHTML=`<div class=bad>⚠️ ${esc(data.nama)} masih di waiting list.</div>`;
 if(data.hadir_at)return res.innerHTML=`<div class=bad>⚠️ ${esc(data.nama)} sudah tercatat hadir sebelumnya.</div>`;
 const {error}=await sb.from('registrations').update({hadir_at:new Date().toISOString()}).eq('id',txt);
 res.innerHTML=error?'<div class=bad>Gagal mencatat.</div>':`<div class=ok>✅ ${esc(data.nama)} — hadir tercatat</div>`;
}
