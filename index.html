<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Absensi Kajian Rutin dan Dauroh Hamimatul Jannah</title>
<style>
:root{--p:#5a2750;--m:#c9a2bd;--l:#f1e1ea;--bg:#fdf6f3;--t:#2b1a27}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:16px system-ui,sans-serif}
header{text-align:center;padding:18px 16px 4px}
header img{width:min(300px,70%);height:auto}
h1{font:700 1.5rem/1.3 Georgia,serif;color:var(--p);margin:6px 0 0}
main{max-width:560px;margin:0 auto;padding:12px 16px 40px}
h2,h3{color:var(--p);font-family:Georgia,serif;margin:14px 0 8px}
.card{background:#fff;border:1px solid var(--l);border-radius:14px;padding:14px;margin:10px 0;display:flex;flex-direction:column;gap:8px;box-shadow:0 1px 4px #5a275015}
small{color:#7a6573}
label{display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--p)}
label.ck{flex-direction:row;align-items:center}
input,select{padding:11px;border:1px solid var(--m);border-radius:10px;font-size:1rem;background:#fff;width:100%}
input[type=checkbox]{width:auto}
button{background:var(--p);color:#fff;border:0;border-radius:10px;padding:12px;font-size:1rem;cursor:pointer}
button.alt{background:var(--l);color:var(--p)}
.full{background:var(--l);color:var(--p);padding:10px;border-radius:10px;text-align:center;font-weight:600}
.c{text-align:center;align-items:center}
.err{color:#b3261e;margin:0}
.ok{background:#e4f3e6;color:#1b5e20;padding:12px;border-radius:10px;font-weight:600}
.bad{background:#fde7e7;color:#b3261e;padding:12px;border-radius:10px;font-weight:600}
nav{display:flex;gap:6px;margin:8px 0}
.tab{flex:1;background:var(--l);color:var(--p);padding:10px 4px}
.tab.on{background:var(--p);color:#fff}
.qr{padding:12px;background:#fff;border:2px solid var(--m);border-radius:12px}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.85rem}
td,th{border-bottom:1px solid var(--l);padding:6px;text-align:left;white-space:nowrap}
a{color:var(--p)}footer{text-align:center;padding:10px}footer a{font-size:.8rem;color:#a58a9b}
</style></head><body>
<header><img src="logo.jpg" alt="Hamimatul Jannah"><h1>Absensi Kajian Rutin dan Dauroh Hamimatul Jannah</h1></header>
<main id="app"></main>
<footer><a href="#admin">Admin</a><br><small>versi 3</small></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script>
const SUPABASE_URL="https://fofjljgkzkrnhqbbhnyb.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZvZmpsamdremtybmhxYmJobnliIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5NzgyMjgsImV4cCI6MjEwODU1NDIyOH0.y4r96iMeK2FTl1qIBpC-1lRJbmQTY0KuBshxll4UfNY";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>new Date(d+'T00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
window.onerror=m=>{const d=document.createElement('div');d.className='bad';d.textContent='Error: '+m;document.body.prepend(d)};
let scanner=null,busy=false;
async function stopScan(){if(scanner){try{await scanner.stop()}catch(e){}scanner=null}}
window.onhashchange=route;route();
async function route(){await stopScan();location.hash.startsWith('#admin')?admin():home()}

/* ===== PESERTA ===== */
async function home(){
 app.innerHTML='<p class=c>Memuat…</p>';
 const {data,error}=await sb.rpc('list_events');
 if(error)return app.innerHTML='<p class=c>Gagal memuat. Coba lagi.</p>';
 window.EV=data;
 app.innerHTML='<h2>Pilih Acara</h2>'+(data.length?data.map(e=>{
  const sisa=Math.max(e.kuota-e.terdaftar,0);
  return `<div class=card><b>${esc(e.title)}</b><small>${esc(e.tipe)} • ${fmt(e.tanggal)} • ${esc(e.jam)}</small><small>Sisa kuota: ${sisa}</small>${sisa?`<button class=daf data-id="${e.id}">Daftar</button>`:'<div class=full>Kuota penuh</div>'}</div>`}).join(''):'<p class=c>Belum ada acara yang dibuka.</p>');
 app.querySelectorAll('.daf').forEach(b=>b.onclick=()=>showForm(b.dataset.id));
}
window.showForm=id=>{
 const e=EV.find(x=>x.id==id);
 app.innerHTML=`<h2>${esc(e.title)}</h2><small>${fmt(e.tanggal)} • ${esc(e.jam)}</small>
 <div class=card><label>Nama<input id=n></label><label>Umur<input id=u type=number></label><label>Domisili<input id=d></label><label>No WA aktif<input id=w type=tel></label><label>Email<input id=m type=email></label>
 <button id=go>Daftar &amp; Dapatkan QR</button><button class=alt onclick="home()">Kembali</button><p id=msg class=err></p></div>`;
 $('#go').onclick=async()=>{
  const v=k=>$('#'+k).value.trim(),msg=$('#msg');
  if(!v('n')||!v('u')||!v('d')||!v('w')||!v('m'))return msg.textContent='Semua kolom wajib diisi.';
  if(!/^\S+@\S+\.\S+$/.test(v('m')))return msg.textContent='Format email belum benar.';
  $('#go').disabled=true;msg.textContent='';
  const {data,error}=await sb.rpc('register',{p_event:id,p_nama:v('n'),p_umur:+v('u'),p_domisili:v('d'),p_wa:v('w'),p_email:v('m')});
  if(error){$('#go').disabled=false;return msg.textContent=/PENUH/.test(error.message)?'Maaf, kuota sudah penuh.':/TUTUP/.test(error.message)?'Pendaftaran sudah ditutup.':'Gagal mendaftar. Coba lagi.'}
  showQR(e,data,v('n'));
 };
};
function showQR(e,id,nama){
 app.innerHTML=`<div class="card c"><h2>Pendaftaran Berhasil ✅</h2><b>${esc(nama)}</b><small>${esc(e.title)}<br>${fmt(e.tanggal)} • ${esc(e.jam)}</small><div id=qr class=qr></div><button id=sv>Simpan QR ke Galeri</button><small>Simpan QR ini, lalu tunjukkan saat tiba di lokasi.</small><button class=alt onclick="home()">Selesai</button></div>`;
 new QRCode($('#qr'),{text:id,width:240,height:240,correctLevel:QRCode.CorrectLevel.M});
 $('#sv').onclick=()=>{
  const src=$('#qr canvas'),c=document.createElement('canvas');c.width=360;c.height=450;
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,360,450);
  x.drawImage(src,60,20,240,240);x.fillStyle='#5a2750';x.textAlign='center';
  x.font='bold 20px Georgia';x.fillText(nama.slice(0,28),180,300);
  x.font='16px sans-serif';x.fillText(e.title.slice(0,40),180,330);x.fillText(e.tanggal+' • '+e.jam,180,356);
  x.fillText('Hamimatul Jannah',180,410);
  const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='QR-'+nama.replace(/\s+/g,'_')+'.png';a.click();
 };
}

/* ===== ADMIN ===== */
async function admin(){
 const {data:{session}}=await sb.auth.getSession();
 session?panel():login();
}
function login(){
 app.innerHTML=`<h2>Login Admin</h2><div class=card><label>Email<input id=e type=email></label><label>Password<input id=p type=password></label><button id=go>Masuk</button><p id=msg class=err></p></div>`;
 $('#go').onclick=async()=>{
  const {error}=await sb.auth.signInWithPassword({email:$('#e').value.trim(),password:$('#p').value});
  error?$('#msg').textContent='Email atau password salah.':panel();
 };
}
const TABS=[['ev','Acara'],['ps','Peserta'],['sc','Scan']];
async function panel(t='ev'){
 await stopScan();
 app.innerHTML=`<nav>${TABS.map(([k,v])=>`<button class="tab ${k==t?'on':''}" onclick="panel('${k}')">${v}</button>`).join('')}<button class=tab onclick="sb.auth.signOut().then(login)">Keluar</button></nav><div id=box></div>`;
 ({ev:tEv,ps:tPs,sc:tSc})[t]();
}
window.panel=panel;
async function tEv(){
 const {data}=await sb.from('events').select('*,registrations(count)').order('tanggal',{ascending:false});
 window.EVS=data||[];
 $('#box').innerHTML=`<div class=card><h3 id=ft style="margin:0">Tambah Acara</h3><input type=hidden id=eid>
 <label>Tema<input id=t></label><label>Jenis<select id=tp><option>Kajian Rutin</option><option>Dauroh</option></select></label>
 <label>Tanggal<input id=tg type=date></label><label>Jam<input id=j placeholder="09.00 - 11.00 WIB"></label>
 <label>Jumlah peserta maksimal<input id=k type=number value=50></label>
 <label class=ck><input id=a type=checkbox checked>&nbsp;Pendaftaran dibuka</label>
 <button id=sv>Simpan</button><p id=msg class=err></p></div>`+EVS.map((e,i)=>`<div class=card><b>${esc(e.title)}</b><small>${esc(e.tipe)} • ${fmt(e.tanggal)} • ${esc(e.jam)}</small><small>Terdaftar ${e.registrations[0].count}/${e.kuota} • ${e.aktif?'Dibuka':'Ditutup'}</small><button class=alt onclick="edit(${i})">Edit</button></div>`).join('');
 $('#sv').onclick=async()=>{
  const r={title:$('#t').value.trim(),tipe:$('#tp').value,tanggal:$('#tg').value,jam:$('#j').value.trim(),kuota:+$('#k').value,aktif:$('#a').checked};
  if(!r.title||!r.tanggal||!r.jam||!(r.kuota>0))return $('#msg').textContent='Lengkapi semua kolom.';
  const id=$('#eid').value;
  const {error}=id?await sb.from('events').update(r).eq('id',id):await sb.from('events').insert(r);
  error?$('#msg').textContent=error.message:tEv();
 };
}
window.edit=i=>{const e=EVS[i];
 $('#eid').value=e.id;$('#t').value=e.title;$('#tp').value=e.tipe;$('#tg').value=e.tanggal;$('#j').value=e.jam;$('#k').value=e.kuota;$('#a').checked=e.aktif;
 $('#ft').textContent='Edit Acara';scrollTo(0,0);
};
async function evPicker(){
 const {data}=await sb.from('events').select('id,title,tanggal').order('tanggal',{ascending:false});
 $('#box').innerHTML=`<select id=se>${(data||[]).map(e=>`<option value="${e.id}">${esc(e.title)} (${e.tanggal})</option>`).join('')}</select><div id=out></div>`;
 return data&&data.length;
}
async function tPs(){
 if(!await evPicker())return $('#out').innerHTML='<p class=c>Belum ada acara.</p>';
 const load=async()=>{
  const {data}=await sb.from('registrations').select('*').eq('event_id',$('#se').value).order('created_at');
  const h=data.filter(r=>r.hadir_at).length;
  $('#out').innerHTML=`<h3>Terdaftar ${data.length} • Hadir ${h}</h3><div class=tbl><table><tr><th>Nama</th><th>Umur</th><th>Domisili</th><th>WA</th><th>Email</th><th>Hadir</th></tr>${data.map(r=>`<tr><td>${esc(r.nama)}</td><td>${r.umur}</td><td>${esc(r.domisili)}</td><td>${esc(r.wa)}</td><td>${esc(r.email)}</td><td>${r.hadir_at?'✅':'-'}</td></tr>`).join('')}</table></div>`;
 };
 $('#se').onchange=load;load();
}
async function tSc(){
 if(!await evPicker())return $('#out').innerHTML='<p class=c>Buat acara dulu.</p>';
 $('#out').innerHTML='<button id=st style="margin:10px 0;width:100%">Mulai Scan</button><div id=rd></div><div id=res></div>';
 $('#st').onclick=async()=>{
  await stopScan();scanner=new Html5Qrcode('rd');
  try{await scanner.start({facingMode:'environment'},{fps:10,qrbox:240},onScan)}
  catch(e){$('#res').innerHTML='<div class=bad>Kamera tidak bisa dibuka. Izinkan akses kamera.</div>'}
 };
}
async function onScan(txt){
 if(busy)return;busy=true;setTimeout(()=>busy=false,2500);
 const res=$('#res');
 if(!/^[0-9a-f-]{36}$/i.test(txt))return res.innerHTML='<div class=bad>QR tidak dikenali.</div>';
 const {data}=await sb.from('registrations').select('id,nama,event_id,hadir_at').eq('id',txt).maybeSingle();
 if(!data)return res.innerHTML='<div class=bad>❌ Peserta tidak ditemukan.</div>';
 if(data.event_id!==$('#se').value)return res.innerHTML=`<div class=bad>❌ ${esc(data.nama)} terdaftar di acara lain.</div>`;
 if(data.hadir_at)return res.innerHTML=`<div class=bad>⚠️ ${esc(data.nama)} sudah tercatat hadir sebelumnya.</div>`;
 const {error}=await sb.from('registrations').update({hadir_at:new Date().toISOString()}).eq('id',txt);
 res.innerHTML=error?'<div class=bad>Gagal mencatat.</div>':`<div class=ok>✅ ${esc(data.nama)} — hadir tercatat</div>`;
}
</script></body></html>
